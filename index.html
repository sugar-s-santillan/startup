<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prometheus Mortgage Pricer</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="main.css">
</head>

<body class="min-h-screen flex flex-col">

    <header class="flex items-center">
        <div class="page-container">
            <h1 id="app-title">Prometheus Mortgage Pricer</h1>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center">
        <section class="login-card">

            <div class="login-heading">
                <h2>Welcome back</h2>
                <p>Log in to access the lender-matching tool.</p>
            </div>

            <form action="leads.html">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="button-group">
                    <button type="submit" class="primary-button">
                        Log in
                    </button>

                    <button type="button" class="secondary-button">
                        Create Account
                    </button>
                </div>

            </form>

        </section>
    </main>

    <footer>
        <div class="page-container flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2">

            <p>Created by Sugar Santillan</p>

            <a
                href="https://github.com/sugar-s-santillan/startup"
                target="_blank"
                rel="noopener noreferrer"
                class="github-link"
            >
                GitHub Repository
            </a>

        </div>
    </footer>

</body>
</html>
